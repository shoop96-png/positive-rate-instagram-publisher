name: Check Instagram credentials

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
      META_API_VERSION: ${{ vars.META_API_VERSION }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
    steps:
      - name: Check out publisher
        uses: actions/checkout@v4

      - name: Verify Instagram account credentials without publishing
        run: |
          python3 - <<'PY'
          import sys
          from scripts.publish_instagram import PublisherError, validate_meta_credentials

          try:
              username = validate_meta_credentials()
          except PublisherError:
              print("::error::Instagram credential check failed. Renew the Meta token and update INSTAGRAM_ACCESS_TOKEN; also check account ID and API version settings.")
              sys.exit(1)
          print(f"Instagram credentials verified for @{username}. Nothing was published.")
          PY
